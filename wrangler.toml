name = "2026-design-portfolio"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-05-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [
  { pattern = "dolbakggom.com", custom_domain = true }
]

[observability]
enabled = true

  [observability.logs]
  enabled = true
  head_sampling_rate = 1
  invocation_logs = false
  persist = true

[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
database_id = "c4f3214b-44dc-455d-9f8a-3a4589254548"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "portfolio-media"

[[kv_namespaces]]
binding = "SESSION"
id = "d5ac5efdcd7544399999b227b19633d6"

[[ratelimits]]
name = "ADMIN_LOGIN_RATE_LIMITER"
namespace_id = "71014"

  [ratelimits.simple]
  limit = 10
  period = 60

[vars]
ADMIN_USERNAME = "dolbakggom"
CLOUDFLARE_ACCESS_ENABLED = "true"
CLOUDFLARE_ACCESS_TEAM_DOMAIN = "dolbakggom.cloudflareaccess.com"
CLOUDFLARE_ACCESS_AUD = "f3a21bdc5434ddd3f80622afaba79aed87cd1a4245e5e3aef1eacae0b814bee2"

[[ratelimits]]
name = "ANALYTICS_RATE_LIMITER"
namespace_id = "71015"

  [ratelimits.simple]
  limit = 120
  period = 60
